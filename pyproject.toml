[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker4agents"
dynamic = ["version"]
description = "ChipLoom: a tracker and chiptune composition toolkit for agents, with a companion desktop editor and HTML listening views"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Arthur Reboul Salze" }]
keywords = [
    "tracker", "chiptune", "mod", "protracker", "music", "composition",
    "agents", "ai-agents", "audio", "cli", "json",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Artistic Software",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ArthurReboulSalze/ChipLoom"
Repository = "https://github.com/ArthurReboulSalze/ChipLoom"
Issues = "https://github.com/ArthurReboulSalze/ChipLoom/issues"
Changelog = "https://github.com/ArthurReboulSalze/ChipLoom/blob/main/CHANGELOG.md"
"Listening room" = "https://arthurreboulsalze.github.io/ChipLoom/"

[project.optional-dependencies]
desktop = ["PySide6>=6.10,<7"]

[project.scripts]
chiploom = "tracker4agents.cli:main"
tracker4agents = "tracker4agents.cli:main"

[project.gui-scripts]
chiploom-desktop = "tracker4agents.desktop:main"
tracker4agents-desktop = "tracker4agents.desktop:main"

[tool.setuptools.packages.find]
include = ["tracker4agents*"]

[tool.setuptools.dynamic]
version = { attr = "tracker4agents.__version__" }

[tool.setuptools.package-data]
tracker4agents = ["assets/*.png"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".tools", "build", "exports", "references"]

[tool.ruff.lint]
select = ["E9", "F"]
