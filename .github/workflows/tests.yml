name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.17.3
      - name: Lint
        run: ruff check tracker4agents tests tools

  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install core only
        run: python -m pip install -e .
      - name: Audit tracked publication contents
        run: python tools/audit_repository.py
      - name: Install Linux audio renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Install the official MCP Python SDK in a separate environment
        # Not a project dependency: tests/test_mcp_clients.py drives `chiploom mcp` with the SDK as a real client.
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/mcp-client"
          if [ -d "$RUNNER_TEMP/mcp-client/Scripts" ]; then CLIENT_PYTHON="$RUNNER_TEMP/mcp-client/Scripts/python.exe"; else CLIENT_PYTHON="$RUNNER_TEMP/mcp-client/bin/python"; fi
          "$CLIENT_PYTHON" -m pip install "mcp==2.3.0"
          echo "CHIPLOOM_MCP_CLIENT_PYTHON=$CLIENT_PYTHON" >> "$GITHUB_ENV"
      - name: Run tests (GUI tests require optional dependencies)
        run: python -m unittest discover -s tests -v
      - name: Build MOD without GUI or external decoder
        run: python -m tracker4agents demo --song pixel-rush --no-audio --output exports/ci-demo
      - name: Validate exported MOD
        run: python -m tracker4agents validate exports/ci-demo/pixel_rush.mod

  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # The Linux desktop run is new: it reports problems without blocking merges until it has proven stable.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            experimental: false
          - os: ubuntu-latest
            experimental: true
    env:
      QT_QPA_PLATFORM: offscreen
      # Qt's own FFmpeg backend prints per-file banners in debug mode; keep the test log readable.
      QT_LOGGING_RULES: qt.multimedia.*.debug=false;qt.multimedia.*.info=false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Linux FFmpeg and Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg libegl1 libxkbcommon0 libgl1 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0 libasound2t64 libxmp4
      - name: Install Windows FFmpeg (full build, includes libopenmpt)
        if: runner.os == 'Windows'
        # The Chocolatey feed sometimes answers 504 and choco still exits 0: retry until ffmpeg exists.
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            choco install ffmpeg-full -y --no-progress
            if (Get-Command ffmpeg -ErrorAction SilentlyContinue) { exit 0 }
            Write-Host "ffmpeg not installed yet (attempt $attempt); retrying"
            Start-Sleep -Seconds (30 * $attempt)
          }
          Write-Error "Could not install FFmpeg from Chocolatey."
          exit 1
      - name: Check FFmpeg and libopenmpt
        shell: bash
        run: |
          ffmpeg -hide_banner -version | head -n 1
          ffmpeg -hide_banner -demuxers | grep -i openmpt
      - name: Build pinned libxmp for real-time playback (Windows)
        if: runner.os == 'Windows'
        run: python tools/setup_reference.py
      - name: Install with desktop extra
        run: python -m pip install -e ".[desktop]" py-spy
      - name: Show the runner's audio devices
        run: python -c "from PySide6.QtMultimedia import QMediaDevices; print([d.description() for d in QMediaDevices.audioOutputs()] or 'no audio output device')"
      - name: Run real-time engine and desktop tests
        # One process per module: a Qt hang stays in its module, the log names it and shows every thread.
        shell: bash
        run: |
          status=0
          for module in test_realtime test_desktop test_desktop_samples test_desktop_editing test_desktop_live test_desktop_08 test_desktop_jam test_desktop_workshop test_desktop_formats test_desktop_realtime; do
            echo "::group::$module"
            timeout 420 python tools/run_test_module.py "tests.$module" 240 || status=1
            echo "::endgroup::"
          done
          exit $status

  build:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build --outdir dist
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl > wheel-contents.txt
          grep -q 'tracker4agents/assets/chiploom-logo.png' wheel-contents.txt
          if grep -E '^(tests|tools|exports|docs|references)/' wheel-contents.txt; then echo 'Unexpected files in wheel'; exit 1; fi
      - name: Smoke-test the wheel
        run: |
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/python -m pip install dist/*.whl
          /tmp/wheel-check/bin/chiploom --version
          /tmp/wheel-check/bin/chiploom estimate --orders 8 --bpm 160
      - uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
