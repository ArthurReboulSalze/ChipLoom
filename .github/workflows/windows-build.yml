name: Windows standalone

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write  # attach the zip to the GitHub release of a pushed tag

jobs:
  windows:
    name: ChipLoom for Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install -e ".[desktop]" pyinstaller
      - name: Build pinned libxmp for real-time playback
        run: python tools/setup_reference.py
      - name: Build the standalone folder
        run: python tools/build_windows.py --zip
      - name: Smoke-test the console tool
        run: |
          build\windows\ChipLoom\chiploom-cli.exe --version
          build\windows\ChipLoom\chiploom-cli.exe estimate --orders 8 --bpm 160
      - uses: actions/upload-artifact@v7
        with:
          name: ChipLoom-windows
          path: build/windows/ChipLoom-*-windows.zip
          if-no-files-found: error
      - name: Attach the zip to the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" build/windows/ChipLoom-*-windows.zip --clobber --repo "${GITHUB_REPOSITORY}"
