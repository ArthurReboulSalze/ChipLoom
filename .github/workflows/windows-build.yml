name: Windows standalone

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    name: ChipLoom for Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build requirements
        run: python -m pip install -e ".[desktop]" pyinstaller
      - name: Build the standalone folder
        run: python tools/build_windows.py --zip
      - name: Smoke-test the console tool
        run: |
          build\windows\ChipLoom\chiploom-cli.exe --version
          build\windows\ChipLoom\chiploom-cli.exe estimate --orders 8 --bpm 160
      - uses: actions/upload-artifact@v4
        with:
          name: ChipLoom-windows
          path: build/windows/ChipLoom-*-windows.zip
          if-no-files-found: error
